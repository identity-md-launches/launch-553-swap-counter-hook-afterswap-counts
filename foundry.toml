[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Uniswap v4-core's PoolManager is pinned to exactly 0.8.26; the independent verifier carries it.
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
# The PoolManager uses transient storage (TSTORE/TLOAD), so the target must be Cancun or later.
evm_version = "cancun"
bytecode_hash = "none"

ffi = false
fs_permissions = []

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
